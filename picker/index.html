<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigScript — Select Folder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0e0c;
      color: #e8e4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1916;
      border: 1px solid #2e2c28;
      border-radius: 14px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .logo span { color: #d4922a; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid #2e2c28;
      border-top-color: #d4922a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    p { color: #8a8070; font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px; }
    .btn {
      display: block;
      width: 100%;
      background: #d4922a;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-cancel {
      background: none;
      color: #8a8070;
      border: 1px solid #2e2c28;
      margin-bottom: 0;
    }
    .error {
      color: #c0392b;
      background: rgba(192,57,43,0.1);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: left;
      display: none;
    }
  </style>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">Gig<span>Script</span></div>
    <div class="spinner" id="spinner"></div>
    <h1 id="status">Loading...</h1>
    <p id="subtext">Opening folder picker</p>
    <div class="error" id="error"></div>
    <button class="btn" id="openBtn" style="display:none" onclick="openPicker()">
      Open folder picker
    </button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none" onclick="cancel()">
      Cancel
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const key = params.get('key');
    const scheme = params.get('scheme') || 'gigscript';

    function cancel() {
      window.location.href = scheme + '://picker?cancelled=true';
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = 'Error';
      document.getElementById('subtext').textContent = '';
      const errEl = document.getElementById('error');
      errEl.textContent = msg;
      errEl.style.display = 'block';
      document.getElementById('openBtn').style.display = 'block';
      document.getElementById('cancelBtn').style.display = 'block';
    }

    function openPicker() {
      document.getElementById('error').style.display = 'none';
      document.getElementById('openBtn').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('status').textContent = 'Opening picker...';

      gapi.load('picker', () => {
        try {
          var view = new google.picker.DocsView(
              google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true);

          var builder = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(token)
            .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
            .setCallback(pickerCallback)
            .setTitle('Select sync folder');

          if (key) builder = builder.setDeveloperKey(key);

          var picker = builder.build();

          document.getElementById('spinner').style.display = 'none';
          document.getElementById('status').textContent = 'Select a folder';
          document.getElementById('subtext').textContent = 'Choose the shared folder your band uses for sync.';
          document.getElementById('cancelBtn').style.display = 'block';

          picker.setVisible(true);
        } catch(e) {
          showError('Could not open picker: ' + e.message);
        }
      });
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        var folder = data.docs[0];
        window.location.href =
          scheme + '://picker?id=' +
          encodeURIComponent(folder.id) +
          '&name=' + encodeURIComponent(folder.name);
      } else if (data.action === google.picker.Action.CANCEL) {
        cancel();
      }
    }

    if (!token) {
      showError('Missing authentication token. Please go back to the app and try again.');
    } else {
      openPicker();
    }
  </script>
</body>
</html>
